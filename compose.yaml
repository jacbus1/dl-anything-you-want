# API only. Run your own Cobalt separately following its official deployment documentation.
# Bind to loopback; place a TLS reverse proxy / edge abuse protection in front before public use.
services:
  framepocket:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COBALT_URL: ${COBALT_URL:-}
      COBALT_API_KEY: ${COBALT_API_KEY:-}
      MAX_FILE_MB: ${MAX_FILE_MB:-100}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
