<body>
<header class="nav shell">
  <a class="brand" href="./" aria-label="DL Anything You Want 首頁"><span class="brand-mark">D</span>DL Anything You Want</a>
  <nav aria-label="主要導覽"><a href="./en/" lang="en">English</a><a href="https://github.com/jacbus1" target="_blank" rel="noopener noreferrer">JACKY H. · GitHub</a></nav>
</header>
<main class="shell">
  <section class="hero">
    <h1>Facebook / Instagram / Threads<br><em>TikTok / YouTube Downloader</em></h1>
    <p class="intro">MP4 影片 · MP3 音訊 · PNG 圖片 · TEXT 文字</p>
  </section>
  <section class="workbench" aria-labelledby="download-title">
    <div class="bench-header"><h2 id="download-title">影片網址</h2><span id="connection" class="connection">檢查連線中</span></div>
    <form id="download-form">
      <div class="selectors">
        <fieldset><legend>平台</legend><div class="choice-row platform-choice"><label><input type="radio" name="platform" value="facebook"><span>Facebook</span></label><label><input type="radio" name="platform" value="instagram"><span>Instagram</span></label><label><input type="radio" name="platform" value="threads"><span>Threads</span></label><label><input type="radio" name="platform" value="tiktok"><span>TikTok</span></label><label><input type="radio" name="platform" value="youtube" checked><span>YouTube</span></label></div></fieldset>
        <fieldset><legend>輸出格式</legend><div class="choice-row format-choice"><label><input type="radio" name="format" value="mp4" checked><span>MP4 <small>影片</small></span></label><label><input type="radio" name="format" value="mp3"><span>MP3 <small>音訊</small></span></label><label><input type="radio" name="format" value="png"><span>PNG <small>圖片</small></span></label><label><input type="radio" name="format" value="txt"><span>TEXT <small>文字</small></span></label></div></fieldset>
        <label id="language-wrap" class="language-choice" hidden>語音語言<select id="language" name="language"><option value="auto">自動偵測</option><option value="zh">中文／普通話</option><option value="yue">粵語</option><option value="en">英文</option><option value="ja">日文</option><option value="ko">韓文</option><option value="es">西班牙文</option><option value="fr">法文</option><option value="de">德文</option></select></label>
      </div>
      <label class="sr-only" for="source-url">所選平台的公開媒體網址</label>
      <div class="input-wrap"><span class="link-icon" aria-hidden="true">↗</span><input id="source-url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=…" required autocomplete="off" spellcheck="false"><button class="paste" type="button" id="paste">貼上</button></div>
      <div class="form-bottom"><label class="consent"><input id="consent" type="checkbox" required><span>這是我的內容，或我已取得下載許可。</span></label><button id="resolve" type="submit" class="primary">下載 <span aria-hidden="true">→</span></button></div>
    </form>
    <p id="message" role="status" aria-live="polite" class="message">下載連結約一分鐘後失效。</p>
    <section id="results" class="results" hidden aria-labelledby="results-heading"><div class="result-heading"><h3 id="results-heading">可儲存的檔案</h3><span id="result-count"></span></div><p id="result-note"></p><div id="file-list"></div></section>
    <div class="bench-footer"><span>只下載你擁有或已取得許可的公開內容</span></div>
  </section>
</main>
<footer class="shell"><span class="footer-brand">DL Anything You Want</span><p>By <a href="https://github.com/jacbus1" rel="author">JACKY H. (@jacbus1)</a></p></footer>
<noscript><p class="shell">請啟用 JavaScript 使用解析介面。</p></noscript>
</body>
</html>
