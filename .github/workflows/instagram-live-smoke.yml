name: Instagram live download smoke

on:
  push:
    branches:
      - feat/import-runnable-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PHOTO_URL: https://www.instagram.com/p/DcjLT7uFChz/?stkn=djQyMjEybHNpOGE1
      REEL_URL: https://www.instagram.com/reel/DdXrvBeTZtA/?stkn=MTZjdDRvamdtYWhqNg==
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start self-hosted Cobalt
        run: |
          docker run -d --name cobalt \
            -p 9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            ghcr.io/imputnet/cobalt:11
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:9000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Cobalt did not become healthy.' >&2
          exit 1

      - name: Probe Cobalt against both real Instagram posts
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local url="$2"
            local out="/tmp/cobalt-${label}.json"
            curl --silent --show-error --fail-with-body \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg url "$url" '{url:$url,alwaysProxy:true,localProcessing:"disabled",downloadMode:"auto"}')" \
              http://127.0.0.1:9000/ > "$out" || true
            jq -e 'type == "object"' "$out" >/dev/null
            status="$(jq -r '.status // "missing"' "$out")"
            error_code="$(jq -r '.error.code // empty' "$out")"
            types="$(jq -r 'if .status=="picker" then [.picker[].type] | unique | join(",") else "single" end' "$out")"
            count="$(jq -r 'if .status=="picker" then (.picker|length) else 1 end' "$out")"
            echo "${label}: cobalt status=${status} count=${count} types=${types}${error_code:+ error=${error_code}}"
            if [ "$status" = error ] || [ "$status" = missing ]; then
              exit 1
            fi
          }
          probe photo "$PHOTO_URL"
          probe reel "$REEL_URL"

      - name: Start FramePocket with Cobalt
        shell: bash
        run: |
          set -euo pipefail
          HOST=127.0.0.1 \
          PORT=3000 \
          PUBLIC_ORIGIN=http://127.0.0.1:3000 \
          ALLOWED_ORIGINS=http://127.0.0.1:3000 \
          COBALT_URL=http://127.0.0.1:9000/ \
          node server.mjs >/tmp/framepocket.log 2>&1 &
          echo $! >/tmp/framepocket.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health | jq -e '.status=="ok" and .instagram=="configured-not-live-verified"' >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'FramePocket did not become healthy.' >&2
          cat /tmp/framepocket.log >&2
          exit 1

      - name: Download real Instagram photo through FramePocket
        continue-on-error: true
        shell: bash
        run: |
          set -u
          resolve_http="$(curl --silent --show-error \
            -o /tmp/photo-resolve.json -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "$PHOTO_URL" '{url:$url,consent:true}')" \
            http://127.0.0.1:3000/api/resolve)"
          error_code="$(jq -r '.error.code // empty' /tmp/photo-resolve.json 2>/dev/null)"
          types="$(jq -r 'if (.items|type)=="array" then [.items[].type] | unique | join(",") else "none" end' /tmp/photo-resolve.json 2>/dev/null)"
          echo "photo: resolve_http=${resolve_http} types=${types}${error_code:+ error=${error_code}}"
          test "$resolve_http" = 200 || exit 1
          path="$(jq -r '[.items[]|select(.type=="photo")][0].path // empty' /tmp/photo-resolve.json)"
          test -n "$path" || exit 1
          download_http="$(curl --silent --show-error \
            -D /tmp/photo.headers -o /tmp/instagram-photo.bin -w '%{http_code}' \
            "http://127.0.0.1:3000${path}")"
          mime="$(awk -F': *' 'tolower($1)=="content-type"{print tolower($2)}' /tmp/photo.headers | tr -d '\r' | tail -1)"
          bytes="$(wc -c </tmp/instagram-photo.bin 2>/dev/null || echo 0)"
          echo "photo: download_http=${download_http} bytes=${bytes} mime=${mime:-none}"
          test "$download_http" = 200 || exit 1
          case "$mime" in image/jpeg|image/png|image/webp) ;; *) exit 1;; esac
          test "$bytes" -gt 1024 || exit 1
          touch /tmp/photo.ok

      - name: Download real Instagram Reel through FramePocket
        continue-on-error: true
        shell: bash
        run: |
          set -u
          resolve_http="$(curl --silent --show-error \
            -o /tmp/reel-resolve.json -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg url "$REEL_URL" '{url:$url,consent:true}')" \
            http://127.0.0.1:3000/api/resolve)"
          error_code="$(jq -r '.error.code // empty' /tmp/reel-resolve.json 2>/dev/null)"
          types="$(jq -r 'if (.items|type)=="array" then [.items[].type] | unique | join(",") else "none" end' /tmp/reel-resolve.json 2>/dev/null)"
          echo "reel: resolve_http=${resolve_http} types=${types}${error_code:+ error=${error_code}}"
          test "$resolve_http" = 200 || exit 1
          path="$(jq -r '[.items[]|select(.type=="video")][0].path // empty' /tmp/reel-resolve.json)"
          test -n "$path" || exit 1
          download_http="$(curl --silent --show-error \
            -D /tmp/reel.headers -o /tmp/instagram-reel.bin -w '%{http_code}' \
            "http://127.0.0.1:3000${path}")"
          mime="$(awk -F': *' 'tolower($1)=="content-type"{print tolower($2)}' /tmp/reel.headers | tr -d '\r' | tail -1)"
          bytes="$(wc -c </tmp/instagram-reel.bin 2>/dev/null || echo 0)"
          echo "reel: download_http=${download_http} bytes=${bytes} mime=${mime:-none}"
          test "$download_http" = 200 || exit 1
          test "$mime" = video/mp4 || exit 1
          test "$bytes" -gt 4096 || exit 1
          touch /tmp/reel.ok

      - name: Require both real downloads
        if: always()
        run: |
          test -f /tmp/photo.ok
          test -f /tmp/reel.ok
          echo 'Both real Instagram downloads passed.'

      - name: Clean up
        if: always()
        run: |
          if [ -f /tmp/framepocket.pid ]; then kill "$(cat /tmp/framepocket.pid)" 2>/dev/null || true; fi
          docker rm -f cobalt >/dev/null 2>&1 || true
          rm -f /tmp/instagram-photo.bin /tmp/instagram-reel.bin /tmp/*-resolve.json /tmp/cobalt-*.json /tmp/*.headers /tmp/photo.ok /tmp/reel.ok
