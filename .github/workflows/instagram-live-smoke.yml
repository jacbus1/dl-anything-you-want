name: Instagram live download smoke

on:
  push:
    branches:
      - feat/import-runnable-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POST_URL: https://www.instagram.com/p/DcjLT7uFChz/?stkn=djQyMjEybHNpOGE1
      REEL_URL: https://www.instagram.com/reel/DdXrvBeTZtA/?stkn=MTZjdDRvamdtYWhqNg==
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start self-hosted Cobalt
        run: |
          docker run -d --name cobalt \
            -p 9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            ghcr.io/imputnet/cobalt:11
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:9000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Cobalt did not become healthy.' >&2
          exit 1

      - name: Probe Cobalt against both real Instagram posts
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local url="$2"
            local out="/tmp/cobalt-${label}.json"
            curl --silent --show-error --fail-with-body \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg url "$url" '{url:$url,alwaysProxy:true,localProcessing:"disabled",downloadMode:"auto"}')" \
              http://127.0.0.1:9000/ > "$out" || true
            jq -e 'type == "object"' "$out" >/dev/null
            status="$(jq -r '.status // "missing"' "$out")"
            error_code="$(jq -r '.error.code // empty' "$out")"
            types="$(jq -r 'if .status=="picker" then [.picker[].type] | unique | join(",") else "single" end' "$out")"
            count="$(jq -r 'if .status=="picker" then (.picker|length) else 1 end' "$out")"
            echo "${label}: cobalt status=${status} count=${count} types=${types}${error_code:+ error=${error_code}}"
            test "$status" != error
            test "$status" != missing
          }
          probe post "$POST_URL"
          probe reel "$REEL_URL"

      - name: Start FramePocket with Cobalt
        shell: bash
        run: |
          set -euo pipefail
          HOST=127.0.0.1 \
          PORT=3000 \
          PUBLIC_ORIGIN=http://127.0.0.1:3000 \
          ALLOWED_ORIGINS=http://127.0.0.1:3000 \
          COBALT_URL=http://127.0.0.1:9000/ \
          node server.mjs >/tmp/framepocket.log 2>&1 &
          echo $! >/tmp/framepocket.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health | jq -e '.status=="ok" and .instagram=="configured-not-live-verified"' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/framepocket.log >&2
          exit 1

      - name: End-to-end download every item from both real Instagram URLs
        shell: bash
        run: |
          set -euo pipefail

          check_source() {
            local label="$1"
            local url="$2"
            local resolve="/tmp/${label}-resolve.json"

            http="$(curl --silent --show-error \
              -o "$resolve" -w '%{http_code}' \
              -H 'Origin: http://127.0.0.1:3000' \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg url "$url" '{url:$url,consent:true}')" \
              http://127.0.0.1:3000/api/resolve)"

            error_code="$(jq -r '.error.code // empty' "$resolve" 2>/dev/null)"
            count="$(jq -r 'if (.items|type)=="array" then (.items|length) else 0 end' "$resolve" 2>/dev/null)"
            types="$(jq -r 'if (.items|type)=="array" then [.items[].type] | unique | join(",") else "none" end' "$resolve" 2>/dev/null)"
            echo "${label}: resolve_http=${http} count=${count} types=${types}${error_code:+ error=${error_code}}"

            test "$http" = 200
            test "$count" -ge 1

            local n=0
            while IFS=$'\t' read -r type path; do
              n=$((n+1))
              headers="/tmp/${label}-${n}.headers"
              file="/tmp/${label}-${n}.bin"
              download_http="$(curl --silent --show-error \
                -D "$headers" -o "$file" -w '%{http_code}' \
                "http://127.0.0.1:3000${path}")"
              mime="$(awk -F': *' 'tolower($1)=="content-type"{print tolower($2)}' "$headers" | tr -d '\r' | tail -1)"
              bytes="$(wc -c <"$file")"
              echo "${label} item ${n}: type=${type} http=${download_http} bytes=${bytes} mime=${mime:-none}"

              test "$download_http" = 200
              case "$type" in
                photo)
                  case "$mime" in image/jpeg|image/png|image/webp) ;; *) exit 1;; esac
                  test "$bytes" -gt 1024
                  ;;
                video)
                  test "$mime" = video/mp4
                  test "$bytes" -gt 4096
                  ;;
                *)
                  echo "Unsupported resolved media type: $type" >&2
                  exit 1
                  ;;
              esac
            done < <(jq -r '.items[] | [.type,.path] | @tsv' "$resolve")

            test "$n" -eq "$count"
          }

          check_source post "$POST_URL"
          check_source reel "$REEL_URL"
          echo 'Both real Instagram URLs downloaded successfully through FramePocket.'

      - name: Clean up
        if: always()
        run: |
          if [ -f /tmp/framepocket.pid ]; then kill "$(cat /tmp/framepocket.pid)" 2>/dev/null || true; fi
          docker rm -f cobalt >/dev/null 2>&1 || true
          rm -f /tmp/post-* /tmp/reel-* /tmp/cobalt-*
