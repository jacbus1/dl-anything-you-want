name: Download Instagram Reel
on:
  push:
    paths:
      - '.github/workflows/download-instagram-reel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader
        run: python -m pip install --upgrade yt-dlp
      - name: Download reel
        shell: bash
        run: |
          yt-dlp --no-playlist --merge-output-format mp4 \
            -o 'instagram-reel.%(ext)s' \
            'https://www.instagram.com/reel/DdreQHJIC1s/?stkn=MXZqeXg3dHhua2UwNg=='
          ls -lah
      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: instagram-reel-DdreQHJIC1s
          path: instagram-reel.*
          if-no-files-found: error
          retention-days: 1
