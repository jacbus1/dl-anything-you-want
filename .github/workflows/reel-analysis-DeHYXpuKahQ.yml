name: Temporary Instagram Reel Analysis - DeHYXpuKahQ
on:
  push:
    paths:
      - '.github/workflows/reel-analysis-DeHYXpuKahQ.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install download tool
        run: python -m pip install --upgrade yt-dlp
      - name: Download reel
        shell: bash
        run: |
          yt-dlp --no-playlist --merge-output-format mp4 -o 'reel-DeHYXpuKahQ.%(ext)s' 'https://www.instagram.com/reel/DeHYXpuKahQ/'
          ls -lah reel-DeHYXpuKahQ.*
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of json reel-DeHYXpuKahQ.mp4
      - name: Extract screenshots and visible text
        shell: bash
        run: |
          mkdir -p frames
          ffmpeg -hide_banner -loglevel error -y -i reel-DeHYXpuKahQ.mp4 -vf 'fps=1/3,scale=720:-1' -frames:v 55 'frames/frame-%03d.jpg'
          if command -v tesseract >/dev/null; then
            for f in frames/*.jpg; do
              output="$(tesseract "$f" stdout 2>/dev/null | tr '\n' ' ' | cut -c1-400)"
              [ -n "$output" ] && echo "$(basename "$f"): $output"
            done
          else
            echo 'OCR unavailable'
          fi
      - name: Upload media and frames
        uses: actions/upload-artifact@v4
        with:
          name: reel-analysis-DeHYXpuKahQ
          path: |
            reel-DeHYXpuKahQ.mp4
            frames/*.jpg
          if-no-files-found: error
          retention-days: 1
